[project]
name = "langgraph-chat"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "ormsgpack>=1.7.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0"
]

[tool.vercel]
entrypoint = "main:app"
